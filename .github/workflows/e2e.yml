name: Canlı uçtan uca test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Test edilecek adres"
        default: "https://yer-misin-yemez-misin.vercel.app"
  # Vercel production deploy'u bittiğinde otomatik çalış
  deployment_status:

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://yer-misin-yemez-misin.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
